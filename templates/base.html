<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rekhaa{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #faf8f5; color: #1f1d1a;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 960px; margin: 0 auto; padding: 20px 24px;
    }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; letter-spacing: .5px; }
    .nav nav { font-size: .95rem; color: #7a746b; }
    .nav nav a { margin-left: 18px; color: #7a746b; text-decoration: none; }
    .nav nav a:hover { color: #8c3b2a; }

    .card {
      max-width: 420px; margin: 24px auto; padding: 36px 32px;
      background: #fff; border: 1px solid #e4dfd7; border-radius: 14px;
    }
    .card h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 1.7rem; margin: 0 0 6px; }
    .sub { color: #7a746b; margin: 0 0 24px; font-size: .95rem; }
    .step { color: #8c3b2a; font-size: .8rem; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .85rem; color: #7a746b; margin-bottom: 6px; }
    input, textarea {
      width: 100%; padding: 11px 12px; font: inherit; color: inherit;
      background: #fff; border: 1px solid #e4dfd7; border-radius: 8px;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus {
      outline: none; border-color: #8c3b2a; box-shadow: 0 0 0 3px rgba(140, 59, 42, .12);
    }
    .hint { color: #7a746b; font-size: .8rem; margin: 6px 0 0; }
    .error { color: #b3261e; font-size: .85rem; margin: 6px 0 0; }

    .btn {
      display: block; width: 100%; margin-top: 6px; padding: 12px;
      background: #1f1d1a; color: #fff; text-align: center; text-decoration: none;
      font: inherit; border: 0; border-radius: 8px; cursor: pointer;
    }
    .btn:hover { background: #8c3b2a; }
    .alt { text-align: center; margin: 20px 0 0; font-size: .9rem; color: #7a746b; }
    .alt a { color: #8c3b2a; }
  </style>
</head>
<body>
  <header class="nav">
    <span class="brand">Rekhaa</span>
    <nav>
      {% if user.is_authenticated %}
        Hi, {{ user.username }}
        <a href="{% url 'logout' %}">Log out</a>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>
  </header>

  <main class="card">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
